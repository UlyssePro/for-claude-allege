services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - hms_node_modules:/app/node_modules
      - hms_next:/app/.next
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - ./.env.base44-defaults
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_SOCKET_URL=https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c 'npm install --ignore-scripts && (npx prisma generate || true) && npx concurrently "next dev --turbopack --hostname 0.0.0.0 --port 3000" "npx tsx src/socket-server.ts"'
    restart: unless-stopped

volumes:
  hms_node_modules:
  hms_next:
